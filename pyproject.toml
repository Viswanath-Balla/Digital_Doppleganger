[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "digital-doppelganger"
version = "0.1.0"
description = "Multi-agent privacy audit: what could an adversary infer by combining your data fragments?"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "duckdb>=1.0,<2",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "streamlit>=1.35,<2",
    "networkx>=3.2,<4",
    "pyvis>=0.3,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-timeout>=2.2,<3",
    "ruff>=0.4,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: smoke tests that need live services",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
